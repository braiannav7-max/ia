  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

margin-top:6px;display:inline-block}\n\n/* assistant chat */\n.chat-thread{display:flex;flex-direction:column;gap:10px;min-height:280px}\n.bubble{max-width:88%;padding:11px 14px;border-radius:14px;font-size:.8rem;line-height:1.55;animation:bubIn .4s ease}\n@keyframes bubIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}\n.bub-ai{background:rgba(150,170,255,.06);border:1px solid var(--bdr);color:var(--w);align-self:flex-start;border-bottom-left-radius:4px}\n.bub-user{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}\n.bub-meta{font-size:.6rem;color:var(--m);margin:2px 4px;letter-spacing:.04em}\n.bub-meta.r{align-self:flex-end}\n.typing{align-self:flex-start;display:flex;gap:4px;padding:11px 14px;background:rgba(150,170,255,.06);border:1px solid var(--bdr);border-radius:14px;border-bottom-left-radius:4px}\n.typing span{width:6px;height:6px;border-radius:50%;background:var(--a2);animation:typing 1.2s ease infinite}\n.typing span:nth-child(2){animation-delay:.18s}\n.typing span:nth-child(3){animation-delay:.36s}\n@keyframes typing{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.1);opacity:1}}\n.chat-input-row{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bdr)}\n.chat-input{flex:1;background:rgba(150,170,255,.04);border:1px solid var(--bdr2);border-radius:99px;padding:10px 16px;color:var(--w);font-family:inherit;font-size:.78rem;outline:none}\n.chat-input:focus{border-color:var(--a1)}\n.chat-send{background:var(--grad);color:#fff;border:none;border-radius:99px;padding:10px 16px;font-family:inherit;font-size:.74rem;font-weight:600;cursor:pointer}\n.chat-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n.chat-quick button{background:rgba(150,170,255,.04);border:1px solid var(--bdr);border-radius:99px;padding:5px 11px;font-family:inherit;font-size:.66rem;color:var(--m2);cursor:pointer;transition:all .2s}\n.chat-quick button:hover{ '🧭'}]},\n    {q:'zr2_q',hint:'zr2_h',type:'single',key:'timeavail',opts:[\n      {k:'tm_few',e:'⏰'},{k:'tm_half',e:'🕐'},{k:'tm_full',e:'🕗'},{k:'tm_all',e:'🔥'}]},\n    {q:'zr3_q',hint:'zr3_h',type:'single',key:'blocker',opts:[\n      {k:'bl_start',e:'🤔'},{k:'bl_tech',e:'⚙️'},{k:'bl_budget',e:'💰'},{k:'bl_fear',e:'😌'}]},\n    {q:'zr4_q',hint:'zr4_h',type:'single',key:'budget',opts:BUDGET}\n  ]\n};\nconst PATH_TAG={scale:'path_scale',launch:'path_launch',zero:'path_zero'};\n\n/* ══════════ STATE ══════════ */\nconst state={path:null,answers:{}};\nlet obIndex=0;\n\n/* ══════════ LANGUAGE ══════════ */\nfunction applyLang(){\n  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });\n  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });\n  document.documentElement.lang=LANG;\n  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));\n  buildTrust();\n  document.querySelectorAll('.eco-mod').forEach(m=>{\n    m.querySelector('.eco-mod-st-txt').textContent = m.classList.contains('active')?t('eco_active'):t('eco_inactive');\n  });\n  refreshEcoFeedback();\n  refreshDashboard();\n  applyProposal();\n  if(document.getElementById('onboarding').style.display!=='none' && state.path) renderStep();\n}\nfunction setLang(l){ LANG=l; try{localStorage.setItem('bb_lang',l);}catch(e){} applyLang(); }\n\n/* ══════════ PARTICLES (ambient visual) ══════════ */\n(function buildParticles(){\n  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;\n  const box=document.getElementById('particles');\n  const colors=['#5b8cff','#b07cff','#46e0d0'];\n  for(let i=0;i<14;i++){\n    const p=document.createElement('div');\n    p.className='particle';\n    const size=2+Math.random()*2.4;\n    const dur=16+Math.random()*16;\n    p.style.width=size+'px';p.style.height=size+'px';\n    p.style.left=(3+Math.random()*94)+'%';\n    p.style.background=colors[i%3];\n    p.style.animationDuration=dur+'s';\n    p.style.animationDelay=(-Math.random()*dur)+'s';\n    p.style.setProperty('--po',(0.22+Math.random()*0.32).toFixed(2));\n    box.appendChild(p);\n  }\n})();\n\n/* ══════════ PRELOADER ══════════ */\nwindow.addEventListener('load',()=>setTimeout(()=>document.getElementById('preloader').classList.add('out'),1500));\n\n/* ══════════ SCROLL HELPER ══════════ */\nfunction goSection(id){\n  const el=document.getElementById(id);\n  if(!el) return;\n  const top=el.getBoundingClientRect().top+window.scrollY-68;\n  window.scrollTo({top,behavior:'smooth'});\n}\n\n/* ══════════ DASHBOARD ══════════ */\nconst salesNums=[12400,18200,21500,26800,31200,38900,44700];\nlet si=0,ai=0,ni=0;\nfunction refreshDashboard(){\n  document.getElementById('d-sales').textContent='$'+salesNums[si].toLocaleString();\n  document.getElementById('ai-txt').textContent=t('aiMsgs')[ai];\n}\nsetInterval(()=>{si=(si+1)%salesNums.length;document.getElementById('d-sales').textContent='$'+salesNums[si].toLocaleString();},2200);\nsetInterval(()=>{\n  ai=(ai+1)%t('aiMsgs').length;\n  const el=document.getElementById('ai-txt');\n  el.style.opacity='0';\n  setTimeout(()=>{el.textContent=t('aiMsgs')[ai];el.style.opacity='1';el.style.transition='opacity .4s';},300);\n},2800);\nfunction addNotif(txt){\n  const w=document.getElementById('notif-wrap');\n  const d=document.createElement('div');\n  d.className='notif';\n  d.innerHTML='<div class=\"notif-check\">✓<\u002Fdiv>'+txt;\n  w.insertBefore(d,w.firstChild);\n  if(w.children.length>3) w.removeChild(w.lastChild);\n}\naddNotif(t('notifs')[1]); addNotif(t('notifs')[0]);\nsetInterval(()=>{ni=(ni+1)%t('notifs').length;addNotif(t('notifs')[ni]);},3000);\n\n/* ══════════ TRUST STRIP ══════════ */\nconst trustIcons=[\n  '<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/>',\n  '<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/>',\n  '<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/>',\n  '<path d=\"M18 20V10M12 20V4M6 20v-6\"/>',\n  '<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m4.93 4.93 14.14 14.14\"/>',\n  '<path d=\"M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\"/>',\n  '<rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M8 21h8M12 17v4\"/>',\n  '<path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"/>'\n];\nfunction buildTrust(){\n  const items=t('trust');\n  let html='';\n  for(let r=0;r<2;r++){\n    items.forEach((label,i)=>{\n      html+='<div class=\"trust-item\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">'+trustIcons[i]+'<\u002Fsvg>'+label+'<\u002Fdiv>';\n    });\n  }\n  document.getElementById('trust-scroll').innerHTML=html;\n}\n\n/* ══════════ ONBOARDING ENGINE ══════════ */\nfunction startOnboarding(path){\n  state.path=path;\n  state.answers={};\n  obIndex=0;\n  document.getElementById('onboarding').style.display='flex';\n  document.getElementById('ob-pathtag-txt').textContent=t(PATH_TAG[path]);\n  renderStep();\n  applyProposal();\n  requestAnimationFrame(()=>goSection('onboarding'));\n}\nfunction showSelector(){\n  document.getElementById('onboarding').style.display='none';\n  goSection('selector');\n}\nfunction renderStep(){\n  const steps=ONB[state.path];\n  const step=steps[obIndex];\n  const total=steps.length;\n  document.getElementById('ob-fill').style.width=((obIndex+1)/total*100)+'%';\n  document.getElementById('ob-count').textContent=(obIndex+1)+' / '+total;\n  document.getElementById('ob-pathtag-txt').textContent=t(PATH_TAG[state.path]);\n  document.getElementById('ob-q').textContent=t(step.q);\n  document.getElementById('ob-hint').textContent=t(step.hint);\n\n  const wrap=document.getElementById('ob-opts');\n  wrap.innerHTML='';\n  const cur=state.answers[step.key];\n  step.opts.forEach(o=>{\n    const b=document.createElement('button');\n    b.className='ob-opt';\n    let selected = step.type==='single' ? cur===o.k : (Array.isArray(cur)&&cur.includes(o.k));\n    if(selected) b.classList.add(step.type==='single'?'sel':'sel-b');\n    b.innerHTML='<span class=\"ob-check\"><\u002Fspan><span class=\"ob-emoji\">'+o.e+'<\u002Fspan><span>'+t(o.k)+'<\u002Fspan>';\n    b.addEventListener('click',()=>obPick(step,o.k,b));\n    wrap.appendChild(b);\n  });\n\n  // replay step-in animation\n  const stepEl=document.getElementById('ob-step');\n  stepEl.style.animation='none';\n  void stepEl.offsetWidth;\n  stepEl.style.animation='';\n\n  updateNextBtn(step);\n  // restore feedback if a single answer already exists\n  if(step.type==='single' && cur){ showMsg(t(cur+'_msg')); }\n  else if(step.type==='multi' && Array.isArray(cur) && cur.length){ showMsg(t('ob_multi_msg')); }\n  else hideMsg();\n}\nfunction obPick(step,k,btn){\n  if(step.type==='single'){\n    document.querySelectorAll('#ob-opts .ob-opt').forEach(o=>o.classList.remove('sel'));\n    btn.classList.add('sel');\n    state.answers[step.key]=k;\n    showMsg(t(k+'_msg'));\n  }else{\n    btn.classList.toggle('sel-b');\n    let arr=state.answers[step.key]||[];\n    const i=arr.indexOf(k);\n    if(i>-1) arr.splice(i,1); else arr.push(k);\n    state.answers[step.key]=arr;\n    if(arr.length) showMsg(t('ob_multi_msg')); else hideMsg();\n  }\n  updateNextBtn(step);\n}\nfunction updateNextBtn(step){\n  const nb=document.getElementById('ob-next');\n  const v=state.answers[step.key];\n  const ok = step.type==='single' ? !!v : (Array.isArray(v)&&v.length>0);\n  nb.classList.toggle('on',ok);\n  const last = obIndex===ONB[state.path].length-1;\n  document.getElementById('ob-next-label').textContent = t(last?'ob_see_eco':'ob_continue');\n}\nfunction obNext(){\n  const steps=ONB[state.path];\n  if(obIndex<steps.length-1){ obIndex++; renderStep(); }\n  else { goEcosystem(); }\n}\nfunction obBack(){\n  if(obIndex>0){ obIndex--; renderStep(); }\n  else { showSelector(); }\n}\nfunction showMsg(txt){\n  document.getElementById('ob-msg-txt').textContent=txt;\n  document.getElementById('ob-msg').classList.add('show');\n}\nfunction hideMsg(){ document.getElementById('ob-msg').classList.remove('show'); }\nfunction goEcosystem(){\n  document.getElementById('onboarding').style.display='none';\n  requestAnimationFrame(()=>goSection('ecosystem'));\n}\n\n/* ══════════ ECOSYSTEM MODULES ══════════ */\nconst totalMods=9;\nlet lastFb=null;\nfunction toggleMod(el){\n  const mod=el.dataset.mod;\n  el.classList.toggle('active');\n  const isActive=el.classList.contains('active');\n  el.querySelector('.eco-mod-st-txt').textContent=isActive?t('eco_active'):t('eco_inactive');\n  if(isActive) lastFb='fb_'+mod;\n  updateEcoPanel();\n  refreshEcoFeedback();\n}\nfunction refreshEcoFeedback(){\n  const fb=document.getElementById('eco-fb');\n  const anyActive=document.querySelectorAll('.eco-mod.active').length>0;\n  fb.textContent = (anyActive&&lastFb) ? t(lastFb) : t('eco_fb_default');\n}\nfunction updateEcoPanel(){\n  const actives=document.querySelectorAll('.eco-mod.active');\n  const list=document.getElementById('eco-list');\n  const empty=document.getElementById('eco-empty');\n  const pct=Math.round((actives.length/totalMods)*100);\n  document.getElementById('eco-fill').style.width=pct+'%';\n  document.getElementById('eco-pct').textContent=pct+'%';\n  list.querySelectorAll('.eco-active-item').forEach(i=>i.remove());\n  if(actives.length===0){ empty.style.display='block'; }\n  else{\n    empty.style.display='none';\n    actives.forEach(a=>{\n      const div=document.createElement('div');\n      div.className='eco-active-item';\n      div.innerHTML='<div class=\"eco-active-dot\"><\u002Fdiv>'+a.querySelector('.eco-mod-name').textContent;\n      list.appendChild(div);\n    });\n  }\n  document.getElementById('eco-cta').classList.toggle('on',actives.length>=2);\n}\n\n/* ══════════ PROPOSAL (varies per path) ══════════ */\nfunction applyProposal(){\n  const reco=document.getElementById('prop-reco');\n  const key = state.path ? ('prop_reco_'+state.path) : 'prop_reco_default';\n  reco.textContent=t(key);\n}\n\n/* ══════════ SCROLL REVEAL ══════════ */\nconst revealObs=new IntersectionObserver((entries)=>{\n  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target); } });\n},{threshold:.12});\ndocument.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el));\ndocument.querySelectorAll('.sel-card,.eco-mod').forEach((el,i)=>{\n  el.classList.add('reveal');\n  el.style.transitionDelay=((i%9)*0.05)+'s';\n  revealObs.observe(el);\n});\n\n/* ══════════════════════════════════════════════════════\n   EXTRA STRINGS (Spanish baseline; t() falls back to ES)\n   ══════════════════════════════════════════════════════ */\nObject.assign(I18N.es, {\n  cin_eyebrow:\"Tu sistema en movimiento\",\n  cin_h1:'Un dashboard. <span>Tu negocio entero.<\u002Fspan>',\n  cin_h2:'Módulos que <span>se conectan solos.<\u002Fspan>',\n  cin_h3:'Un ecosistema. <span>Listo para escalar.<\u002Fspan>',\n  cin_ai_msg:\"Optimizando\", cin_ai_msg2:\"Procesando\",\n  cin_leads:\"Leads\", cin_pipe:\"Pipeline\",\n  cin_pipe_1:\"María — Convertida\", cin_pipe_2:\"Carlos — Caliente\", cin_pipe_3:\"Sofía — Reunión\",\n  cin_s1:\"Dashboard\", cin_s2:\"Conexión\", cin_s3:\"Ecosistema\",\n  cin_hint:\"Scrolleá para ver tu sistema construirse\",\n  ins_tag:\"Inteligencia personalizada\", ins_h2:'Tu sistema <span>te responde.<\u002Fspan>',\n  ins_sub:\"Tu ecosistema analiza lo que elegiste y devuelve sugerencias accionables. En tiempo real.\",\n  ins_assistant:\"Asistente IA\", ins_assistant_sub:\"Feedback en tiempo real\", ins_online:\"Online\",\n  ins_reco:\"Recomendaciones para ti\", ins_reco_sub:\"Generadas a partir de tus respuestas\",\n  chat_greet:\"¡Hola! Soy tu asistente IA. Analicé tu perfil y tengo todo listo para guiarte. ¿Por dónde querés empezar?\",\n  cq_modules:\"¿Qué módulos me recomendás?\", cq_tim to:\"Automatización\", prev_kpi_eng:\"Engagement\",\n  prev_brand_lbl:\"Tu marca\", prev_brand_smalllbl:\"Brand identity\",\n  prev_brand_tagline_default:\"Profesional, moderna y lista para escalar.\",\n  prev_brand_live:\"Sistema en vivo\", prev_brand_kit:\"Brand kit\", prev_done:\"listo\",\n  prev_wa_lbl:\"WhatsApp IA\", prev_wa_name:\"Asistente\", prev_wa_status:\"● en línea\",\n  prev_wa_msg1:\"Hola, vi su web. ¿Tienen disponibilidad?\",\n  prev_wa_msg2:\"¡Hola! 👋 Sí, tenemos cupo esta semana. ¿Te paso el link para agendar?\",\n  prev_wa_msg3:\"Sí porfa\", prev_wa_msg4:\"Listo, te llega ahora. Cualquier duda estoy acá.\",\n  prev_wa_typing:\"Asistente escribiendo...\",\n  prev_cap:\"Esto no es una maqueta. Es exactamente lo que vas a operar el día uno.\"\n});\n\n/* ══════════════════════════════════════════════════════\n   CINEMA — 3D scroll-driven showcase\n   ══════════════════════════════════════════════════════ */\nconst C={};\nfunction initCinema(){\n  C.sec=document.getElementById('cinema');\n  if(!C.sec) return;\n  C.screen=document.getElementById('c-screen');\n  C.orbit=document.getElementById('c-orbit');\n  C.lines=document.getElementById('c-lines');\n  C.stage=document.getElementById('c-stage');\n  C.headlines=document.querySelectorAll('#c-headline h2');\n  C.mods=[...document.querySelectorAll('#c-orbit .c-mod')];\n  C.steps=[...document.querySelectorAll('.c-prog-step')];\n  C.linePaths=[...document.querySelectorAll('#c-lines path')];\n  C.glow=document.getElementById('c-glow');\n\n  // Module 3D resting positions (px from center, rotateY)\n  // 2 columns of 3 around the screen\n  const baseX=440, baseY=210;\n  C.modTargets=[\n    {x:-baseX, y:-baseY, ry: 22},  // top left\n    {x: baseX, y:-baseY, ry:-22},  // top right\n    {x:-baseX-70,y:  0,  ry: 30},  // mid left\n    {x: baseX+70,y:  0,  ry:-30},  // mid right\n    {x:-baseX, y: baseY, ry: 22},  // bottom left\n    {x: baseX, y: baseY, ry:-22}   // bottom right\n  ];\n  C.linePaths.forEach(p=>{ const L=p.getTotalLength?p.getTotalLength():800; p.style.strokeDasharray=L+' '+L; p.style.strokeDashoffset=L; p.dataset.L=L; });\n  requestAnimationFrame(updateCinema);\n}\nfunction clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}\nfunction lerp(a,b,t){return a+(b-a)*t}\nfunction easeOut(t){return 1-Math.pow(1-t,3)}\nfunction easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}\n\nfunction updateCinema(){\n  if(!C.sec) return;\n  const r=C.sec.getBoundingClientRect();\n  const vh=window.innerHeight;\n  const total=Math.max(1,C.sec.offsetHeight - vh);\n  const prog=clamp(-r.top/total,0,1);\n  // skip work if section is fully out of view\n  if(r.bottom < -200 || r.top > vh+200) return;\n\n  // ── SCENE A (0 → 0.33) screen rises in 3D\n  const sA=clamp(prog/0.33);\n  const eA=easeOut(sA);\n  // ── SCENE B (0.33 → 0.66) modules fly into position; camera tilts\n  const sB=clamp((prog-0.33)/0.33);\n  const eB=easeOut(sB);\n  // ── SCENE C (0.66 → 1) full composition pulls back\n  const sC=clamp((prog-0.66)/0.34);\n  const eC=easeInOut(sC);\n\n  // SCREEN transform\n  // Scene A: rotateX 60→0, translateY 30%→0, scale .55→1\n  // Scene B: small tilt up (rotateX -4)\n  // Scene C: pull back rotateY -10 rotateX 6 scale .82\n  const rotX = lerp(60,0,eA) + lerp(0,-4,eB) + lerp(0,10,eC);\n  const rotY = lerp(0,0,eA) + lerp(0,-10,eC);\n  const tY   = lerp(28,0,eA) + lerp(0,-2,eC); // % of viewport\n  const sc   = lerp(0.55,1,eA) * lerp(1,0.82,eC);\n  const opA  = lerp(0.2,1,clamp(sA*1.4));\n  C.screen.style.transform=\n    `translate(-50%,-50%) translateY(${tY}vh) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${sc})`;\n  C.screen.style.opacity=opA;\n\n  // ORBIT container — slight global tilt in Scene C\n  const orbitRotY = lerp(0,-12,eC);\n  const orbitRotX = lerp(0,8,eC);\n  const orbitScale = lerp(1,0.92,eC);\n  C.orbit.style.transform=`translate(-50%,-50%) rotateX(${orbitRotX}deg) rotateY(${orbitRotY}deg) scale(${orbitScale})`;\n\n  // MODULES — fly in during scene B, stagger\n  C.mods.forEach((el,i)=>{\n    const t=C.modTargets[i];\n    // staggered progress: each module gets a window inside scene B\n    const stagger=i*0.07;\n    const localProg=clamp((sB - stagger)/0.55);\n    const e=easeOut(localProg);\n    // start far away with translateZ -400 + opacity 0\n    const tx=lerp(0,t.x,e);\n    const ty=lerp(0,t.y,e);\n    const tz=lerp(-420,0,e);\n    const ry=lerp(0,t.ry,e);\n    const opM=lerp(0,1,clamp(e*1.4));\n    // in scene C, add depth offset for parallax\n    const cz=lerp(0,30+(i%2?-20:20),eC);\n    el.style.transform=`translate(-50%,-50%) translate3d(${tx}px,${ty}px,${tz+cz}px) rotateY(${ry}deg)`;\n    el.style.opacity=opM;\n  });\n\n  // LINES — draw during scene B finish, fade in C\n  C.linePaths.forEach((p,i)=>{\n    const stagger=i*0.05;\n    const localProg=clamp((sB - 0.35 - stagger)/0.6);\n    const L=+p.dataset.L;\n    p.style.strokeDashoffset=L*(1-easeOut(localProg));\n    p.style.opacity=Math.min(easeOut(localProg), 0.6) * (1 - sC*0.4);\n  });\n\n  // HEADLINES — fade through 3 phases\n  const sceneIdx = prog < 0.33 ? 0 : (prog < 0.7 ? 1 : 2);\n  C.headlines.forEach((h,i)=>h.classList.toggle('on',i===sceneIdx));\n  C.steps.forEach((s,i)=>s.classList.toggle('on',i===sceneIdx));\n\n  // GLOWS pulse with progress\n  C.glow.style.setProperty('--gA', (0.35 + Math.sin(prog*Math.PI*2)*0.15).toFixed(2));\n  C.glow.style.setProperty('--gB', (0.35 + Math.cos(prog*Math.PI*2)*0.15).toFixed(2));\n}\nlet cinemaTick=false;\nwindow.addEventListener('scroll',()=>{\n  if(cinemaTick) return;\n  cinemaTick=true;\n  requestAnimationFrame(()=>{ updateCinema(); cinemaTick=false; });\n},{passive:true});\nwindow.addEventListener('resize',updateCinema);\nconst STEPS=[\n  {n:1,id:'hero',label:'Landing'},\n  {n:2,id:'selector',label:'Selección de perfil'},\n  {n:3,id:'onboarding',label:'Onboarding'},\n  {n:4,id:'ecosystem',label:'Ecosystem Builder'},\n  {n:5,id:'insights',label:'Feedback IA'},\n  {n:6,id:'insights',label:'Recomendaciones'},\n  {n:7,id:'proposal',label:'Propuesta'},\n  {n:8,id:'proposal',label:'Roadmap'},\n  {n:9,id:'investment',label:'Inversión'},\n  {n:10,id:'preview',label:'Preview del futuro'},\n  {n:11,id:'final-cta',label:'CTA final'}\n];\nfunction buildStepJumper(){\n  const wrap=document.getElementById('step-jumper');\n  wrap.innerHTML='';\n  STEPS.forEach(s=>{\n    const b=document.createElement('button');\n    b.className='step-dot';\n    b.dataset.target=s.id;\n    b.dataset.n=s.n;\n    b.innerHTML=String(s.n).padStart(2,'0')+'<span class=\"tip\">'+s.n+'. '+s.label+'<\u002Fspan>';\n    b.addEventListener('click',()=>jumpToStep(s.n));\n    wrap.appendChild(b);\n  });\n}\nfunction jumpToStep(n){\n  const s=STEPS.find(x=>x.n===n);\n  if(!s) return;\n  if(s.id==='onboarding' && !state.path){ startOnboarding('scale'); }\n  else if(s.id==='onboarding'){ document.getElementById('onboarding').style.display='flex'; goSection('onboarding'); }\n  else goSection(s.id);\n  setActiveStep(n);\n}\nfunction setActiveStep(n){\n  document.querySelectorAll('.step-dot').forEach(d=>d.classList.toggle('on',+d.dataset.n===n));\n}\n// Map scroll → logical step\nfunction updateActiveStepOnScroll(){\n  const y=window.scrollY+window.innerHeight*0.35;\n  // pick deepest section above the cursor\n  let active=1;\n  const seen={};\n  STEPS.forEach(s=>{\n    const el=document.getElementById(s.id);\n    if(!el) return;\n    // skip hidden onboarding\n    if(el.style.display==='none' && s.id==='onboarding') return;\n    const top=el.offsetTop;\n    const h=el.offsetHeight;\n    if(y>=top){\n      // count occurrences to choose between e.g. 5/6 (both insights) by scroll depth\n      seen[s.id]=(seen[s.id]||0)+1;\n      const ratio=Math.min(1,(y-top)/Math.max(1,h));\n      if(s.id==='insights'){ active=ratio>=.5?6:5; }\n      else if(s.id==='proposal'){ active=ratio>=.55?8:7; }\n      else active=s.n;\n    }\n  });\n  setActiveStep(active);\n}\nwindow.addEventListener('scroll',updateActiveStepOnScroll,{passive:true});\n\n/* ══════════════════════════════════════════════════════\n   CHAT ASSISTANT (deterministic — pulls from state)\n   ══════════════════════════════════════════════════════ */\nfunction chatAdd(role,text,delay=0){\n  const thread=document.getElementById('chat-thread');\n  setTimeout(()=>{\n    const b=document.createElement('div');\n    b.className='bubble '+(role==='ai'?'bub-ai':'bub-user');\n    b.textContent=text;\n    thread.appendChild(b);\n    thread.scrollTop=thread.scrollHeight;\n  },delay);\n}\nfunction chatTyping(){\n  const thread=document.getElementById('chat-thread');\n  const t=document.createElement('div');\n  t.className='typing';t.id='typing-now';\n  t.innerHTML='<span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>';\n  thread.appendChild(t);\n  thread.scrollTop=thread.scrollHeight;\n  return ()=>t.remove();\n}\nfunction chatAsk(kind){\n  let qLabel='', ansKey='';\n  if(kind==='modules'){\n    qLabel=t('cq_modules');\n    ansKey = state.path ? 'chat_a_modules_'+state.path : 'chat_a_modules_default';\n  } else if(kind==='time'){ qLabel=t('cq_time'); ansKey='chat_a_time'; }\n  else if(kind==='roi'){ qLabel=t('cq_roi'); ansKey='chat_a_roi'; }\n  else { qLabel=kind; ansKey=resolveFreeText(kind); }\n  chatAdd('user',qLabel);\n  const stop=chatTyping();\n  setTimeout(()=>{ stop(); chatAdd('ai',t(ansKey)); },900);\n}\nfunction resolveFreeText(q){\n  const k=q.toLowerCase();\n  if(/modul|recomend|qué necesito|que necesito/.test(k)) return state.path?'chat_a_modules_'+state.path:'chat_a_modules_default';\n  if(/tiempo|cuándo|cuando|días|dias|semana/.test(k)) return 'chat_a_time';\n  if(/roi|retorno|recuper|invers|pago/.test(k)) return 'chat_a_roi';\n  return 'chat_a_fallback';\n}\n\n/* ══════════════════════════════════════════════════════\n   RECOMENDACIONES IA — generated from state\n   ══════════════════════════════════════════════════════ */\nconst RECO_CATALOG={\n  whatsapp:{icon:'💬',titleK:'r_wa_t',textK:'r_wa_d'},\n  crm:{icon:'👥',titleK:'r_crm_t',textK:'r_crm_d'},\n  branding:{icon:'🎨',titleK:'r_brand_t',textK:'r_brand_d'},\n  web:{icon:'🌐',titleK:'r_web_t',textK:'r_web_d'},\n  content:{icon:'🎬',titleK:'r_content_t',textK:'r_content_d'},\n  analytics:{icon:'📊',titleK:'r_analytics_t',textK:'r_analytics_d'},\n  funnel:{icon:'⚡',titleK:'r_funnel_t',textK:'r_funnel_d'},\n  meta:{icon:'📈',titleK:'r_meta_t',textK:'r_meta_d'}\n};\nfunction buildRecos(){\n  // pick 4 recos in priority order per path/answers\n  let picks=[];\n  if(state.path==='scale'){\n    picks=['whatsapp','crm','funnel','content'];\n    if(state.answers.bottleneck==='bn_marketing') picks=['meta','funnel','content','analytics'];\n    if(state.answers.bottleneck==='bn_followup') picks=['crm','whatsapp','funnel','analytics'];\n    if(state.answers.bottleneck==='bn_support') picks=['whatsapp','crm','content','analytics'];\n  } else if(state.path==='launch'){\n    picks=['branding','web','whatsapp','funnel'];\n    if(state.answers.ptype==='pt_physical') picks=['web','branding','meta','whatsapp'];\n    if(state.answers.ptype==='pt_service') picks=['branding','crm','whatsapp','content'];\n  } else if(state.path==='zero'){\n    picks=['branding','web','whatsapp','content'];\n  } else {\n    picks=['whatsapp','crm','branding','web'];\n  }\n  const TAGS=['reco_tag_priority','reco_tag_priority','reco_tag_medium','reco_tag_growth'];\n  const list=document.getElementById('reco-list');\n  if(!list) return;\n  list.innerHTML='';\n  picks.forEach((k,i)=>{\n    const r=RECO_CATALOG[k];\n    const item=document.createElement('div');\n    item.className='reco-item';\n    item.style.animationDelay=(i*0.08)+'s';\n    item.innerHTML='<div class=\"reco-icon\">'+r.icon+'<\u002Fdiv>'+\n      '<div class=\"reco-body\"><div class=\"reco-title\">'+t(r.titleK)+'<\u002Fdiv>'+\n      '<div class=\"reco-text\">'+t(r.textK)+'<\u002Fdiv>'+\n      '<span class=\"reco-tag\">'+t(TAGS[i])+'<\u002Fspan><\u002Fdiv>';\n    list.appendChild(item);\n  });\n}\n\n/* ══════════════════════════════════════════════════════\n   PREVIEW — sync brand name/tagline from tweaks/state\n   ══════════════════════════════════════════════════════ */\nfunction syncPreview(){\n  const n=document.getElementById('brand-name-prev');\n  const tag=document.getElementById('brand-tagline-prev');\n  if(n) n.textContent=tweaks.brandName||'Tu marca';\n  if(tag) tag.textContent=tweaks.brandTagline||t('prev_brand_tagline_default');\n}\n\n/* ══════════════════════════════════════════════════════\n   TWEAKS — palette, density, animation, step jumper, brand\n   ══════════════════════════════════════════════════════ */\nconst PALETTES={\n  default:{a1:'#5b8cff',a2:'#b07cff',a3:'#46e0d0',brandA:'#a78bff',brandB:'#5b8cff'},\n  emerald:{a1:'#46e0d0',a2:'#34c997',a3:'#5b8cff',brandA:'#34c997',brandB:'#46e0d0'},\n  sunset:{a1:'#ff8a5b',a2:'#ff5b9a',a3:'#ffce5b',brandA:'#ff5b9a',brandB:'#ff8a5b'},\n  mono:{a1:'#dfe3f2',a2:'#a8aec5',a3:'#7e85a0',brandA:'#dfe3f2',brandB:'#7e85a0'}\n};\nlet tweaks={...TWEAK_DEFAULTS};\n\nfunction applyPalette(name){\n  const p=PALETTES[name]||PALETTES.default;\n  const r=document.documentElement.style;\n  r.setProperty('--a1',p.a1); r.setProperty('--a2',p.a2); r.setProperty('--a3',p.a3);\n  r.setProperty('--grad','linear-gradient(135deg,'+p.a1+','+p.a2+')');\n  r.setProperty('--brand-grad-a',p.brandA); r.setProperty('--brand-grad-b',p.brandB);\n  document.querySelectorAll('#tw-swatches .tw-swatch').forEach(s=>s.classList.toggle('on',s.dataset.k===name));\n}\nfunction applyDensity(v){\n  document.body.classList.remove('density-compact','density-spacious');\n  if(v==='compact') document.body.classList.add('density-compact');\n  if(v==='spacious') document.body.classList.add('density-spacious');\n  document.querySelectorAll('#tw-density button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));\n}\nfunction applyAnim(v){\n  document.body.classList.remove('anim-low','anim-high');\n  if(+v===0) document.body.classList.add('anim-low');\n  if(+v===2) document.body.classList.add('anim-high');\n  document.getElementById('tw-anim-val').textContent=['Baja','Media','Alta'][+v]||'Media';\n  document.getElementById('tw-anim').value=v;\n}\nfunction applyBrand(){\n  // hero / nav / footer / preloader logos\n  const nm=tweaks.brandName||'Tu marca';\n  // Build \"Word<em>Word<\u002Fem>\" if two words, else plain\n  const parts=nm.trim().split(/\\s+/);\n  let html;\n  if(parts.length>=2){ html=parts[0]+'<em>'+parts.slice(1).join(' ')+'<\u002Fem>'+(/IA|AI/i.test(nm)?'':''); }\n  else { html='<em>'+nm+'<\u002Fem>'; }\n  document.querySelectorAll('.nav-logo, .footer-logo, .pre-logo').forEach(el=>el.innerHTML=html);\n  syncPreview();\n}\nfunction openTweaks(){ document.getElementById('tweaks').classList.add('show'); }\nfunction closeTweaks(){\n  document.getElementById('tweaks').classList.remove('show');\n  try{ window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }catch(e){}\n}\nfunction persistTweaks(partial){\n  try{ window.parent.postMessage({type:'__edit_mode_set_keys',edits:partial},'*'); }catch(e){}\n}\nfunction setTweak(k,v){\n  tweaks[k]=v;\n  if(k==='palette') applyPalette(v);\n  else if(k==='density') applyDensity(v);\n  else if(k==='animIntensity') applyAnim(v);\n  else if(k==='brandName'||k==='brandTagline') applyBrand();\n  persistTweaks({[k]:v});\n}\nfunction buildTweaksUI(){\n  // palette swatches\n  const sw=document.getElementById('tw-swatches');\n  sw.innerHTML='';\n  Object.entries(PALETTES).forEach(([k,p])=>{\n    const d=document.createElement('div');\n    d.className='tw-swatch'; d.dataset.k=k;\n    d.innerHTML='<div style=\"background:'+p.a1+'\"><\u002Fdiv><div style=\"background:'+p.a2+'\"><\u002Fdiv><div style=\"background:'+p.a3+'\"><\u002Fdiv>';\n    d.addEventListener('click',()=>setTweak('palette',k));\n    sw.appendChild(d);\n  });\n  // density\n  document.querySelectorAll('#tw-density button').forEach(b=>{\n    b.addEventListener('click',()=>setTweak('density',b.dataset.v));\n  });\n  // animation\n  document.getElementById('tw-anim').addEventListener('input',e=>setTweak('animIntensity',+e.target.value));\n  // step jumper inside panel\n  const sg=document.getElementById('tw-steps');\n  sg.innerHTML='';\n  STEPS.forEach(s=>{\n    const b=document.createElement('button');\n    b.textContent=String(s.n).padStart(2,'0');\n    b.title=s.label;\n    b.addEventListener('click',()=>{\n      document.querySelectorAll('#tw-steps button').forEach(x=>x.classList.remove('on'));\n      b.classList.add('on'); jumpToStep(s.n);\n    });\n    sg.appendChild(b);\n  });\n  // brand inputs\n  const bn=document.getElementById('tw-brand'); bn.value=tweaks.brandName;\n  bn.addEventListener('input',e=>setTweak('brandName',e.target.value));\n  const tg=document.getElementById('tw-tagline'); tg.value=tweaks.brandTagline;\n  tg.addEventListener('input',e=>setTweak('brandTagline',e.target.value));\n}\n\n/* edit-mode protocol: register listener first, then announce availability */\nwindow.addEventListener('message',e=>{\n  if(!e.data||typeof e.data!=='object') return;\n  if(e.data.type==='__activate_edit_mode') openTweaks();\n  else if(e.data.type==='__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('show');\n});\n\n/* ══════════════════════════════════════════════════════\n   HOOK: re-run dynamic content when path/eco changes\n   ══════════════════════════════════════════════════════ */\nconst _origApplyProposal=applyProposal;\napplyProposal=function(){\n  _origApplyProposal();\n  buildRecos();\n  syncPreview();\n};\n\nconst _origToggleMod=toggleMod;\ntoggleMod=function(el){\n  _origToggleMod(el);\n  buildRecos();\n};\n(function init(){\n  let saved=null;\n  try{ saved=localStorage.getItem('bb_lang'); }catch(e){}\n  if(!saved){\n    const nv=(navigator.language||'es').slice(0,2).toLowerCase();\n    saved=['es','en','pt'].includes(nv)?nv:'es';\n  }\n  LANG=saved;\n  applyLang();\n\n  // step jumper + tweaks\n  buildStepJumper();\n  buildTweaksUI();\n  applyPalette(tweaks.palette);\n  applyDensity(tweaks.density);\n  applyAnim(tweaks.animIntensity);\n  applyBrand();\n  buildRecos();\n  setActiveStep(1);\n  initCinema();\n\n  // chat assistant\n  document.querySelectorAll('#chat-quick button').forEach(b=>{\n    b.addEventListener('click',()=>chatAsk(b.dataset.q));\n  });\n  const send=document.getElementById('chat-send');\n  const inp=document.getElementById('chat-input');\n  if(send && inp){\n    const doSend=()=>{ const v=inp.value.trim(); if(!v) return; chatAsk(v); inp.value=''; };\n    send.addEventListener('click',doSend);\n    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') doSend(); });\n  }\n\n  // observe new sections for reveal\n  document.querySelectorAll('#insights .reveal, #investment .reveal, #preview .reveal').forEach(el=>revealObs.observe(el));\n\n  // announce edit mode availability (listener was already registered above)\n  try{ window.parent.postMessage({type:'__edit_mode_available'},'*'); }catch(e){}\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
